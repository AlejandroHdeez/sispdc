<mat-dialog-title mat-dialog-title>
    <div class="d-flex justify-content-between align-items-center">
        <div class="text-start">
            <span>{{ colaborator ? 'Editar' : 'Agregar'}} empresa </span>
        </div>
        <div class="text-end">
            <button mat-mini-fab (click)="close()" matTooltip="Cerrar">
                <mat-icon>close</mat-icon>
            </button>
        </div>
    </div>
</mat-dialog-title>

<mat-dialog-content>
    <form [formGroup]="form" autocomplete="off">

        <div class="row m-t-10">
            <div class="col-lg-12 col-md-12">
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>Empresas</mat-label>
                    <mat-select formControlName="companyIds" multiple>
                        <mat-option *ngFor="let item of companies" [value]="item.id">{{ item.comercialName
                            }}</mat-option>
                    </mat-select>
                </mat-form-field>
            </div>

            <div class="col-lg-12 col-md-12">
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>Nombre completo</mat-label>
                    <input type="text" matInput required id="fullname" name="fullname" formControlName="fullname"
                        placeholder="Nombre completo" />
                    <mat-error>El campo es requerido</mat-error>
                </mat-form-field>
            </div>

            <div class="col-lg-4 col-md-4">
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>Edad</mat-label>
                    <input type="text" matInput required id="age" name="age" formControlName="age" placeholder="Edad" />
                    <mat-error>El campo es requerido</mat-error>
                </mat-form-field>
            </div>

            <div class="col-lg-4 col-md-4">
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>Teléfono</mat-label>
                    <input type="text" matInput required id="phoneNumber" name="phoneNumber"
                        formControlName="phoneNumber" placeholder="Teléfono" />
                    <mat-error>El campo es requerido</mat-error>
                </mat-form-field>
            </div>

            <div class="col-lg-4 col-md-4">
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>Correo Electrónico</mat-label>
                    <input type="text" matInput required id="email" name="email" formControlName="email"
                        placeholder="Correo Electrónico" />
                    <mat-error>El campo es requerido</mat-error>
                </mat-form-field>
            </div>

            <div class="col-lg-12 col-md-12">
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>Estado</mat-label>
                    <mat-select formControlName="statusId" required>
                        @for (item of statusOptions; track item.statusId) {
                        <mat-option [value]="item.statusId">{{ item.name }}</mat-option>
                        }
                    </mat-select>
                </mat-form-field>
            </div>

        </div>
    </form>
</mat-dialog-content>

<mat-dialog-actions>
    <div class="col-md-12 text-center">
        <button mat-flat-button (click)="save()" mat-flat-button color="primary" [disabled]="!form.valid">
            Guardar
        </button>
        <button mat-stroked-button color="warn" class="m-l-8" (click)="close()">
            Cerrar
        </button>
    </div>
</mat-dialog-actions>
